# =============================================================================
#  ESP32 + SHT31-D  –  Temperatur- & Luftfeuchtigkeitssensor für Home Assistant
# =============================================================================
#  Hardware : ESP32 DevKit (esp32dev) + Sensirion SHT31-D (I²C)
#  Firmware : ESPHome
#  Verdrahtung siehe README.md
#
#  Benötigt nur `wifi_ssid` und `wifi_password` in den ESPHome-Secrets.
#  Diese legt ESPHome beim ersten Gerät automatisch an.
# =============================================================================

substitutions:
  device_name: esp32-sht31            # Hostname im Netzwerk (nur a-z, 0-9, -)
  friendly_name: Raumklima            # Anzeigename in Home Assistant
  update_interval: 30s                # Wie oft der Sensor gelesen wird
  i2c_sda: GPIO21                     # Standard-SDA-Pin beim ESP32 DevKit
  i2c_scl: GPIO22                     # Standard-SCL-Pin beim ESP32 DevKit
  sht31_address: "0x44"               # 0x44 (ADR offen/GND) oder 0x45 (ADR an 3V3)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: techgaisi-lab.esp32-sht31-homeassistant
    version: "1.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# -----------------------------------------------------------------------------
#  System
# -----------------------------------------------------------------------------
logger:

# Verbindung zu Home Assistant – wird automatisch erkannt, ohne Key-Eingabe
api:

# Updates über WLAN
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

# -----------------------------------------------------------------------------
#  Hardware
# -----------------------------------------------------------------------------
i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true

# -----------------------------------------------------------------------------
#  Sensoren
# -----------------------------------------------------------------------------
sensor:
  - platform: sht3xd
    address: ${sht31_address}
    update_interval: ${update_interval}
    temperature:
      name: "Temperatur"
      id: temperature
      accuracy_decimals: 1
      filters:
        - offset: 0.0               # Kalibrierung: z. B. -0.5 bei Eigenerwärmung
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
    humidity:
      name: "Luftfeuchtigkeit"
      id: humidity
      accuracy_decimals: 0
      filters:
        - offset: 0.0
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1

  # Taupunkt aus Temperatur und Luftfeuchtigkeit (Magnus-Formel)
  - platform: template
    name: "Taupunkt"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${update_interval}
    lambda: |-
      const float t = id(temperature).state;
      const float rh = id(humidity).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      const float a = 17.62f, b = 243.12f;
      const float gamma = logf(rh / 100.0f) + (a * t) / (b + t);
      return (b * gamma) / (a - gamma);

  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

# -----------------------------------------------------------------------------
#  Diagnose & Steuerung
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Neustart"
    entity_category: config

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
