# Vorlage für die Zugangsdaten.
# Kopieren nach `secrets.yaml` und Werte eintragen – `secrets.yaml` wird nie committet.

wifi_ssid: "MeinWLAN"
wifi_password: "MeinWLANPasswort"

# Passwort für den Fallback-Hotspot (mind. 8 Zeichen)
fallback_ap_password: "fallback1234"

# 32-Byte-Key, Base64-kodiert. Erzeugen mit:  openssl rand -base64 32
api_encryption_key: "HIER_EIGENEN_KEY_EINTRAGEN="

# Passwort für Updates über WLAN (OTA)
ota_password: "MeinOTAPasswort"
