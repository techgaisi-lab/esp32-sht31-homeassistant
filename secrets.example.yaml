# Vorlage für die Zugangsdaten – nur nötig, wenn du ohne Home Assistant flashst.
# Im ESPHome Add-on sind diese Werte nach dem ersten Gerät bereits vorhanden.
# Kopieren nach `secrets.yaml` und Werte eintragen – `secrets.yaml` wird nie committet.

wifi_ssid: "MeinWLAN"
wifi_password: "MeinWLANPasswort"
